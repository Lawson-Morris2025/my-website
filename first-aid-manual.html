<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St John Ambulance Cymru - First Aid Manual 11th Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* St John Green and Lawson Morris Dark Theme */
            --st-john-green: #005a3c;
            --lm-dark: #0f172a;
            --accent: #ffffff;
        }

        body {
            background-color: var(--lm-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            transition: opacity 0.8s ease-in-out;
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            z-index: -1;
        }

        .loader-box {
            text-align: center;
            animation: fadeIn 1s ease-out;
            max-width: 90%;
        }

        .progress-container {
            width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin: 24px auto 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--st-john-green), #00a36c);
            box-shadow: 0 0 20px rgba(0, 163, 108, 0.4);
            transition: width 0.4s cubic-bezier(0.1, 0.5, 0.5, 1);
        }

        .percentage-counter {
            font-family: 'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.05em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-ring {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 90, 60, 0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .branding-footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            letter-spacing: 0.15em;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }

        .st-john-badge {
            background: var(--st-john-green);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 18px;
            box-shadow: 0 4px 10px rgba(0, 90, 60, 0.3);
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>

    <div class="loader-box">
        <div class="logo-ring">
            <svg viewBox="0 0 100 100" class="w-14 h-14 text-white" fill="currentColor">
                <path d="M50 5 L95 50 L50 95 L5 50 Z M50 20 L35 50 L50 80 L65 50 Z" />
            </svg>
        </div>

        <div class="st-john-badge">ST JOHN AMBULANCE CYMRU</div>
        
        <h2 class="text-2xl font-bold mb-1 tracking-tight">11th Edition Manual</h2>
        <p class="text-slate-400 text-sm italic">Initializing encrypted document stream...</p>

        <div class="progress-container">
            <div class="progress-bar" id="bar"></div>
        </div>
        <div class="percentage-counter"><span id="percent">0</span>%</div>
    </div>

    <div class="branding-footer font-semibold">
        Exclusively distributed by <span class="text-white border-b border-white/20 pb-0.5">lawsonmorris.co.uk</span>
    </div>

    <script>
        const redirectUrl = "https://jumpshare.com/share/WzH2pQu0zgjBT1JAlsBQ";
        const bar = document.getElementById('bar');
        const percentText = document.getElementById('percent');
        let progress = 0;

        // Controlled loading simulation (approx 4-6 seconds)
        const interval = setInterval(() => {
            // Smaller increments to make it "load longer"
            let increment = Math.random() * 8;
            
            // Slow down as it reaches the end
            if (progress > 80) {
                increment = Math.random() * 2.5;
            }

            progress += increment;

            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                handleRedirect();
            }

            const currentDisplay = Math.floor(progress);
            bar.style.width = currentDisplay + '%';
            percentText.textContent = currentDisplay;

        }, 400);

        function handleRedirect() {
            setTimeout(() => {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 800);
            }, 600);
        }
    </script>
</body>
</html>
