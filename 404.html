<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // Lost in Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .heading-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        .glitch-wrapper {
            position: relative;
        }
        .glitch-text {
            font-size: 12rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #fff;
            position: relative;
            display: inline-block;
        }
        /* Subtle static background effect */
        .static-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Canis_Major_Constellation_Static.gif');
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
        }
        .bento-card {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            z-index: 2;
        }
        .action-btn {
            padding: 12px 24px;
            border-radius: 99px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-primary:hover {
            background: #00f2ff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #555;
        }
        .btn-secondary:hover {
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="static-overlay"></div>

    <div class="glitch-wrapper mb-8 text-center">
        <h1 class="glitch-text heading-font opacity-20">404</h1>
    </div>

    <div class="bento-card text-center">
        <h2 class="heading-font text-3xl font-bold mb-4">Lost in the void?</h2>
        <p class="text-zinc-500 mb-8 leading-relaxed">
            The coordinates you provided lead to a non-existent sector of the digital sky.
        </p>
        
        <div class="flex flex-col gap-3">
            <button onclick="window.location.href='/';" class="action-btn btn-primary">
                Return to Reality
            </button>
            <button onclick="window.location.href='https://lawsonmorris.co.uk/timetravel';" class="action-btn btn-secondary">
                Try Time Travel
            </button>
        </div>
    </div>

    <footer class="mt-12 text-[10px] text-zinc-700 font-mono tracking-widest uppercase z-10">
        ERROR_CODE: NULL_POINTER_TEMPORAL
    </footer>

</body>
</html>
